<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2900 650" width="100%" height="100%" style="background-color: #ffffff;">
    <defs>
        <!-- 定义箭头样式 -->
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#000000" />
        </marker>
    </defs>

    <g stroke="#000000" stroke-width="1.5">
        <!-- ==================== 连线 (主线) ==================== -->
        <!-- L0 (1425,75) to L1 (Y=175) -->
        <line x1="1425" y1="75" x2="400" y2="175" />
        <line x1="1425" y1="75" x2="1150" y2="175" />
        <line x1="1425" y1="75" x2="1850" y2="175" />
        <line x1="1425" y1="75" x2="2450" y2="175" />

        <!-- L1 to L2: 系统管理 (400,225) to children (Y=375) -->
        <line x1="400" y1="225" x2="200" y2="375" />
        <line x1="400" y1="225" x2="400" y2="375" />
        <line x1="400" y1="225" x2="600" y2="375" />

        <!-- L1 to L2: 图书管理 (1150,225) to children (Y=375) -->
        <line x1="1150" y1="225" x2="850" y2="375" />
        <line x1="1150" y1="225" x2="1050" y2="375" />
        <line x1="1150" y1="225" x2="1250" y2="375" />
        <line x1="1150" y1="225" x2="1450" y2="375" />

        <!-- L1 to L2: 读者管理 (1850,225) to children (Y=375) -->
        <line x1="1850" y1="225" x2="1750" y2="375" />
        <line x1="1850" y1="225" x2="1950" y2="375" />

        <!-- L1 to L2: 借阅管理 (2450,225) to children (Y=375) -->
        <line x1="2450" y1="225" x2="2250" y2="375" />
        <line x1="2450" y1="225" x2="2450" y2="375" />
        <line x1="2450" y1="225" x2="2650" y2="375" />
    </g>

    <!-- ==================== 数据流箭头与标签 ==================== -->
    <g font-family="sans-serif" fill="#000000">
        
        <!-- Root -> 系统管理 -->
        <g transform="translate(912.5, 125) rotate(174.4)">
            <line x1="-30" y1="-12" x2="30" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-174.4, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">用户/权限指令</text>
        </g>
        
        <!-- Root -> 图书管理 -->
        <g transform="translate(1287.5, 125) rotate(159.9)">
            <line x1="-30" y1="-12" x2="30" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-159.9, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">图书管理指令</text>
            <line x1="30" y1="12" x2="-30" y2="12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="27" transform="rotate(-159.9, 0, 27)" text-anchor="middle" dominant-baseline="middle" font-size="14">查询结果</text>
        </g>

        <!-- Root -> 读者管理 -->
        <g transform="translate(1637.5, 125) rotate(13.2)">
            <line x1="-30" y1="-12" x2="30" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-13.2, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">读者管理指令</text>
            <line x1="30" y1="12" x2="-30" y2="12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="27" transform="rotate(-13.2, 0, 27)" text-anchor="middle" dominant-baseline="middle" font-size="14">读者情况</text>
        </g>

        <!-- Root -> 借阅管理 -->
        <g transform="translate(1937.5, 125) rotate(5.6)">
            <line x1="-30" y1="-12" x2="30" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-5.6, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">借阅处理指令</text>
            <line x1="30" y1="12" x2="-30" y2="12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="27" transform="rotate(-5.6, 0, 27)" text-anchor="middle" dominant-baseline="middle" font-size="14">处理结果</text>
        </g>


        <!-- 系统管理 -> 1.1 用户信息管理 -->
        <g transform="translate(300, 300) rotate(143.1)">
            <line x1="-20" y1="-12" x2="20" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-143.1, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">用户信息</text>
        </g>
        <!-- 系统管理 -> 1.2 权限管理 -->
        <g transform="translate(400, 300) rotate(90.0)">
            <line x1="-20" y1="-12" x2="20" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-90.0, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">权限信息</text>
        </g>
        <!-- 系统管理 -> 1.3 用户类别管理 -->
        <g transform="translate(500, 300) rotate(36.9)">
            <line x1="-20" y1="-12" x2="20" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-36.9, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">类别信息</text>
        </g>

        <!-- 图书管理 -> 2.1 图书信息管理 -->
        <g transform="translate(1000, 300) rotate(153.4)">
            <line x1="-35" y1="-12" x2="35" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-153.4, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">图书录入、查询信息</text>
            <line x1="35" y1="12" x2="-35" y2="12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="27" transform="rotate(-153.4, 0, 27)" text-anchor="middle" dominant-baseline="middle" font-size="14">查询情况</text>
        </g>
        <!-- 图书管理 -> 2.2 图书资料管理 -->
        <g transform="translate(1100, 300) rotate(123.7)">
            <line x1="-25" y1="-12" x2="25" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-123.7, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">类别信息</text>
        </g>
        <!-- 图书管理 -> 2.3 出版社管理 -->
        <g transform="translate(1200, 300) rotate(56.3)">
            <line x1="-25" y1="-12" x2="25" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-56.3, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">出版社信息</text>
        </g>
        <!-- 图书管理 -> 2.4 注销管理 -->
        <g transform="translate(1300, 300) rotate(26.6)">
            <line x1="-25" y1="-12" x2="25" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-26.6, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">注销信息</text>
        </g>

        <!-- 读者管理 -> 3.1 读者类别管理 -->
        <g transform="translate(1800, 300) rotate(123.7)">
            <line x1="-30" y1="-12" x2="30" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-123.7, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">读者类别信息</text>
        </g>
        <!-- 读者管理 -> 3.2 读者信息管理 -->
        <g transform="translate(1900, 300) rotate(56.3)">
            <line x1="-25" y1="-12" x2="25" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-56.3, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">读者录入信息</text>
            <line x1="25" y1="12" x2="-25" y2="12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="27" transform="rotate(-56.3, 0, 27)" text-anchor="middle" dominant-baseline="middle" font-size="14">读者情况</text>
        </g>

        <!-- 借阅管理 -> 4.1 借书管理 -->
        <g transform="translate(2350, 300) rotate(143.1)">
            <line x1="-25" y1="-12" x2="25" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-143.1, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">借阅信息</text>
        </g>
        <!-- 借阅管理 -> 4.2 还书管理 -->
        <g transform="translate(2450, 300) rotate(90.0)">
            <line x1="-25" y1="-12" x2="25" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-90.0, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">还书信息</text>
            <line x1="25" y1="12" x2="-25" y2="12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="27" transform="rotate(-90.0, 0, 27)" text-anchor="middle" dominant-baseline="middle" font-size="14">罚款信息</text>
        </g>
        <!-- 借阅管理 -> 4.3 续借管理 -->
        <g transform="translate(2550, 300) rotate(36.9)">
            <line x1="-25" y1="-12" x2="25" y2="-12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="-22" transform="rotate(-36.9, 0, -22)" text-anchor="middle" dominant-baseline="middle" font-size="14">续借信息</text>
            <line x1="25" y1="12" x2="-25" y2="12" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
            <text x="0" y="27" transform="rotate(-36.9, 0, 27)" text-anchor="middle" dominant-baseline="middle" font-size="14">续借情况</text>
        </g>

    </g>


    <!-- ==================== 矩形框与文字 ==================== -->
    <g font-family="sans-serif" font-size="16" text-anchor="middle" dominant-baseline="central">
        <!-- Level 0 (Root) -->
        <rect x="1345" y="25" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="1425" y="50" fill="#000000" font-weight="bold">图书馆管理信息系统</text>

        <!-- Level 1 -->
        <rect x="320" y="175" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="400" y="200" fill="#000000" font-weight="bold">1 系统管理</text>

        <rect x="1070" y="175" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="1150" y="200" fill="#000000" font-weight="bold">2 图书管理</text>

        <rect x="1770" y="175" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="1850" y="200" fill="#000000" font-weight="bold">3 读者管理</text>

        <rect x="2370" y="175" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="2450" y="200" fill="#000000" font-weight="bold">4 借阅管理</text>

        <!-- Level 2 (系统管理子模块) -->
        <rect x="120" y="375" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="200" y="400" fill="#000000">1.1 用户信息管理</text>

        <rect x="320" y="375" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="400" y="400" fill="#000000">1.2 权限管理</text>

        <rect x="520" y="375" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="600" y="400" fill="#000000">1.3 用户类别管理</text>

        <!-- Level 2 (图书管理子模块) -->
        <rect x="770" y="375" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="850" y="400" fill="#000000">2.1 图书信息管理</text>

        <rect x="970" y="375" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="1050" y="400" fill="#000000">2.2 图书资料管理</text>

        <rect x="1170" y="375" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="1250" y="400" fill="#000000">2.3 出版社管理</text>

        <rect x="1370" y="375" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="1450" y="400" fill="#000000">2.4 注销管理</text>

        <!-- Level 2 (读者管理子模块) -->
        <rect x="1670" y="375" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="1750" y="400" fill="#000000">3.1 读者类别管理</text>

        <rect x="1870" y="375" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="1950" y="400" fill="#000000">3.2 读者信息管理</text>

        <!-- Level 2 (借阅管理子模块) -->
        <rect x="2170" y="375" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="2250" y="400" fill="#000000">4.1 借书管理</text>

        <rect x="2370" y="375" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="2450" y="400" fill="#000000">4.2 还书管理</text>

        <rect x="2570" y="375" width="160" height="50" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
        <text x="2650" y="400" fill="#000000">4.3 续借管理</text>
    </g>
</svg>